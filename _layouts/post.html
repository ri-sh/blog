---
layout: default
---
<article>
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">{{ page.date | date: "%B %-d, %Y" }}{% if page.tags.size > 0 %} &middot; {{ page.tags | join: ", " }}{% endif %}</p>
  </header>
  <div class="post-content">
    {{ content }}
  </div>
</article>
<a class="back-link" href="{{ '/' | relative_url }}">&larr; Back to all posts</a>
