---
layout: default
---
<article>
  <h1 class="post-title">{{ page.title }}</h1>
  <p class="post-meta">
    {{ page.date | date: "%B %-d, %Y" }}
    {% for tag in page.tags %}<span class="category-link">{{ tag }}</span>{% endfor %}
  </p>
  <div class="post-content">
    {{ content }}
  </div>
</article>
<p><a href="{{ '/' | relative_url }}">&larr; Back to all posts</a></p>
