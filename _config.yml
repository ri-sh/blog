title: "Rishabh's Blog"
tagline: "Notes from building things"
description: "Notes on the things I build — apps, experiments, and everything in between."
author: Rishabh Roy
email: allmyexperimentsin@gmail.com
github_username: ri-sh

baseurl: "/blog"
url: "https://ri-sh.github.io"

markdown: kramdown
permalink: /:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
